# 文档站部署到 GitHub Pages
#
# 触发条件：
#   - push 到 main（涉及 docs/packages/workflow 改动时）
#   - 手动触发（workflow_dispatch）
#
# 构建产物：apps/docs/dist（dumi build 默认输出）
# 访问地址：https://aurora510.github.io/my-ui-lib/
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# deploy-pages 需要写 Pages 环境 + OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先构建所有包（docs 依赖 workspace:* 的构建产物），再构建文档站
      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
